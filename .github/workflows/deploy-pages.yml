# GitHub only runs workflows from the repository root. The app lives in nyc-transportation/.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nyc-transportation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nyc-transportation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # simdong.github.io/nyc-transportation/ maps to folder nyc-transportation/ in the published site
      - name: Stage under /nyc-transportation
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p deploy/nyc-transportation
          cp -r nyc-transportation/dist/. deploy/nyc-transportation/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
